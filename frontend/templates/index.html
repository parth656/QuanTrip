<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuanTrip AI</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a class="brand" href="/">
      <span class="brand-logo">✈️</span>
      <span class="brand-name">QuanTrip AI</span>
    </a>
    <span class="nav-tag">Smart Travel Planning</span>
  </nav>

  <div class="container">

    <h2 class="page-title">
      Smart Itinerary Generator
    </h2>

    <p class="page-subtitle">
      Generate personalized travel itineraries using AI
    </p>

    <div class="card">

      <form id="itinerary-form">

        <div class="form-group">
          <label class="form-label" for="destination">
            Destination
          </label>

          <input
            class="form-input"
            type="text"
            list="dest-options"
            id="destination"
            placeholder="e.g. Goa"
            autocomplete="off"
            required
          />

          <datalist id="dest-options">
            <option value="Amritsar"></option>
            <option value="Goa"></option>
            <option value="Manali"></option>
            <option value="Delhi"></option>
            <option value="Mumbai"></option>
          </datalist>
        </div>

        <div class="form-group">
          <label class="form-label" for="days">
            No. of Days
          </label>

          <input
            class="form-input"
            type="number"
            id="days"
            min="1"
            max="30"
            value="3"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="budget">
            Budget
          </label>

          <select
            class="form-input"
            id="budget"
            required
          >
            <option value="economy">Economy</option>
            <option value="moderate" selected>Moderate</option>
            <option value="luxury">Luxury</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="traveller_count">
            Traveller Count
          </label>

          <input
            class="form-input"
            type="number"
            id="traveller_count"
            min="1"
            max="50"
            value="1"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label">
            Travel Interests
            <span class="label-hint">(tap to select one or more)</span>
          </label>

          <!-- Clickable multi-select chips -->
          <div class="chips" id="interests">
            <button type="button" class="chip" data-value="nature">Nature</button>
            <button type="button" class="chip" data-value="historical">Historical</button>
            <button type="button" class="chip" data-value="food">Food</button>
            <button type="button" class="chip" data-value="shopping">Shopping</button>
            <button type="button" class="chip" data-value="religious">Religious</button>
          </div>
        </div>

        <button
          class="submit-btn"
          type="submit"
        >
          Generate Itinerary
        </button>

      </form>
    </div>

    <div class="card">

      <div class="section-title">
        Generated Itinerary
      </div>

      <div
        id="output"
        class="output-card"
      >
        Your itinerary will appear here...
      </div>

    </div>

  </div>


  <script>
    // --- Chip multi-select: toggle "active" class on click ---
    const chipBox = document.getElementById("interests");
    chipBox.addEventListener("click", function (e) {
      const chip = e.target.closest(".chip");
      if (chip) chip.classList.toggle("active");
    });

    // helper: read all selected chip values
    function getSelectedInterests() {
      return Array.from(
        chipBox.querySelectorAll(".chip.active")
      ).map(function (chip) {
        return chip.dataset.value;
      });
    }

    const form = document.getElementById("itinerary-form");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const output = document.getElementById("output");

      const interests = getSelectedInterests();

      const payload = {
        destination: document
          .getElementById("destination")
          .value
          .trim(),

        days: parseInt(
          document.getElementById("days").value,
          10
        ),

        budget: document
          .getElementById("budget")
          .value,

        traveller_count: parseInt(
          document.getElementById("traveller_count").value,
          10
        ),

        interests: interests
      };

      output.textContent =
        "Generating itinerary. Please wait...";

      try {
        const response = await fetch("/api/itinerary", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            typeof data.detail === "string"
              ? data.detail
              : JSON.stringify(data.detail)
          );
        }

        output.textContent =
          data.plan || JSON.stringify(data, null, 2);

      } catch (error) {
        output.textContent =
          "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
